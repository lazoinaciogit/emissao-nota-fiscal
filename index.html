<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitação de Nota Fiscal - Dr. Lázaro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        ::placeholder {
            color: #4b5563; /* gray-600 */
        }
        /* Remove as setas de input number */
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
        .form-input {
            background-color: #1f2937; /* gray-800 */
            border: 1px solid #374151; /* gray-700 */
            color: #f3f4f6; /* gray-100 */
            transition: all 0.2s ease-in-out;
        }
        .form-input:focus {
            outline: none;
            border-color: #4f46e5; /* indigo-600 */
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.5);
        }
        .form-input[readonly] {
            background-color: #374151; /* gray-700 */
            cursor: not-allowed;
        }
    </style>
</head>
<body class="bg-gray-900 flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-2xl mx-auto bg-gray-800/50 backdrop-blur-sm border border-gray-700 rounded-3xl shadow-2xl p-6 md:p-10">
        <!-- Cabeçalho -->
        <div class="text-center mb-8">
            <h1 class="text-2xl md:text-3xl font-bold text-gray-100">Emissão de Nota Fiscal</h1>
            <p class="text-gray-400 mt-2">Preencha os dados abaixo para solicitar sua NF.</p>
        </div>

        <!-- Formulário -->
        <form id="nf-form" class="space-y-6">
            <!-- Área de Identificação do Titular -->
            <div class="bg-indigo-900/20 p-4 rounded-xl border border-indigo-500/30 space-y-6">
                 <!-- CPF -->
                <div>
                    <label for="cpf" class="block text-sm font-medium text-gray-300">1. CPF do Titular</label>
                    <input type="text" id="cpf" name="cpf" inputmode="numeric" placeholder="Digite o CPF para iniciar" class="form-input mt-1 block w-full px-4 py-2 rounded-lg" required>
                </div>
                <!-- Nome Completo -->
                <div>
                    <label for="nome" class="block text-sm font-medium text-gray-300">2. Nome Completo (Titular)</label>
                    <input type="text" id="nome" name="nome" placeholder="Digite o nome completo do titular da NF" class="form-input mt-1 block w-full px-4 py-2 rounded-lg" required>
                </div>
            </div>

            <!-- CEP -->
             <div>
                <label for="cep" class="block text-sm font-medium text-gray-300">CEP</label>
                <input type="text" id="cep" name="cep" inputmode="numeric" placeholder="Digite o CEP para buscar o endereço" class="form-input mt-1 block w-full px-4 py-2 rounded-lg" required>
            </div>

            <!-- Endereço Autofill -->
            <div class="grid grid-cols-1 md:grid-cols-6 gap-6">
                <div class="md:col-span-4">
                    <label for="logradouro" class="block text-sm font-medium text-gray-300">Rua / Avenida</label>
                    <input type="text" id="logradouro" name="logradouro" placeholder="Preenchido automaticamente" class="form-input mt-1 block w-full px-4 py-2 rounded-lg" readonly required>
                </div>
                <div class="md:col-span-2">
                    <label for="numero" class="block text-sm font-medium text-gray-300">Número</label>
                    <input type="text" id="numero" name="numero" placeholder="Digite o nº" class="form-input mt-1 block w-full px-4 py-2 rounded-lg" required>
                </div>
                 <div class="md:col-span-2">
                    <label for="bairro" class="block text-sm font-medium text-gray-300">Bairro</label>
                    <input type="text" id="bairro" name="bairro" placeholder="Preenchido automaticamente" class="form-input mt-1 block w-full px-4 py-2 rounded-lg" readonly required>
                </div>
                <div class="md:col-span-2">
                    <label for="cidade" class="block text-sm font-medium text-gray-300">Cidade</label>
                    <input type="text" id="cidade" name="cidade" placeholder="Preenchido automaticamente" class="form-input mt-1 block w-full px-4 py-2 rounded-lg" readonly required>
                </div>
                <div class="md:col-span-2">
                    <label for="uf" class="block text-sm font-medium text-gray-300">Estado</label>
                    <input type="text" id="uf" name="uf" placeholder="Preenchido automaticamente" class="form-input mt-1 block w-full px-4 py-2 rounded-lg" readonly required>
                </div>
            </div>
             
             <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Nome do Paciente -->
                <div>
                    <label for="paciente" class="block text-sm font-medium text-gray-300">Nome do Paciente</label>
                    <input type="text" id="paciente" name="paciente" placeholder="Digite o nome do paciente" class="form-input mt-1 block w-full px-4 py-2 rounded-lg" required>
                </div>

                <!-- Valor da NF -->
                <div>
                    <label for="valor" class="block text-sm font-medium text-gray-300">Valor da NF</label>
                    <select id="valor" name="valor" class="form-input mt-1 block w-full px-4 py-2 rounded-lg">
                        <option value="300,00">R$ 300,00</option>
                        <option value="600,00">R$ 600,00</option>
                    </select>
                </div>
            </div>

            <!-- Botão de Compartilhar -->
            <div class="pt-4">
                <button type="button" id="share-button" class="w-full flex items-center justify-center gap-3 px-6 py-3 border border-transparent text-base font-medium rounded-xl text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-gray-800 focus:ring-green-500 shadow-lg shadow-green-500/20 transform hover:-translate-y-0.5 transition-all duration-300 ease-in-out">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    <span>Compartilhar via WhatsApp</span>
                </button>
            </div>
        </form>

        <!-- Mensagem de Erro/Sucesso (Toast) -->
        <div id="toast" class="fixed top-5 right-5 px-6 py-3 rounded-lg text-white shadow-lg transition-transform transform translate-x-[150%]" style="transition: transform 0.5s ease-in-out;">
            <p id="toast-message"></p>
        </div>
    </div>
    <script type="module" src="index.tsx"></script>
</body>
</html>
